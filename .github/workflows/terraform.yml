name: terraform

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:

  # =========================
  # SANDBOX
  # =========================
  sandbox:
    name: Sandbox
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/environments/sandbox

    env:
      TF_VAR_project_id: atewodros-sandbox
      TF_VAR_region: us-east1
      TF_VAR_env: sandbox
      TF_VAR_cloud_run_image: ${{ secrets.TF_VAR_cloud_run_image_SANDBOX }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_SANDBOX }}
          service_account: ${{ secrets.GCP_TF_SA_SANDBOX }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -input=false -no-color

      - name: Apply (push to main only)
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve


  # =========================
  # STAGING (PR only)
  # =========================
  stag:
    name: Staging (PR only)
    runs-on: ubuntu-latest
    needs: sandbox
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: infra/environments/stag

    env:
      TF_VAR_project_id: atewodros-stag
      TF_VAR_region: us-east1
      TF_VAR_env: stag
      TF_VAR_cloud_run_image: ${{ secrets.TF_VAR_cloud_run_image_STAG }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_STAG }}
          service_account: ${{ secrets.GCP_TF_SA_STAG }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -input=false -no-color


  # =========================
  # PROD (PR only)
  # =========================
  prod:
    name: Production (PR only)
    runs-on: ubuntu-latest
    needs: stag
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: infra/environments/prod

    env:
      TF_VAR_project_id: atewodros-prod
      TF_VAR_region: us-east1
      TF_VAR_env: prod
      TF_VAR_cloud_run_image: ${{ secrets.TF_VAR_cloud_run_image_PROD }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_TF_SA_PROD }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -input=false -no-color