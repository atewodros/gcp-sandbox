name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      promote:
        description: "Choose environment to APPLY (manual promotion)"
        required: true
        type: choice
        options:
          - stag
          - prod
          - sandbox

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # =========================
  # SANDBOX (always runs on PR; runs on push and applies)
  # =========================
  sandbox:
    name: Sandbox
    runs-on: ubuntu-latest
    environment: sandbox

    defaults:
      run:
        working-directory: infra/environments/sandbox

    env:
      TF_VAR_project_id: atewodros-sandbox
      TF_VAR_region: us-east1
      TF_VAR_env: sandbox
      TF_VAR_cloud_run_image: ${{ secrets.TF_VAR_cloud_run_image_SANDBOX }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Auth (sandbox)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_SANDBOX }}
          service_account: ${{ secrets.GCP_TF_SA_SANDBOX }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -input=false -no-color

      - name: Apply (push to main only)
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve


  # =========================
  # STAG (PR plan only OR manual promotion apply)
  # - On PR: plan only
  # - On workflow_dispatch promote=stag|prod: apply (and is required before prod)
  # =========================
  stag:
    name: Staging
    runs-on: ubuntu-latest
    needs: sandbox
    environment: stag
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    defaults:
      run:
        working-directory: infra/environments/stag

    env:
      TF_VAR_project_id: atewodros-stag
      TF_VAR_region: us-east1
      TF_VAR_env: stag
      TF_VAR_cloud_run_image: ${{ secrets.TF_VAR_cloud_run_image_STAG }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Auth (stag)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_STAG }}
          service_account: ${{ secrets.GCP_TF_SA_STAG }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -input=false -no-color

      - name: Apply (manual promotion only)
        if: github.event_name == 'workflow_dispatch' && (inputs.promote == 'stag' || inputs.promote == 'prod')
        run: terraform apply -input=false -auto-approve


  # =========================
  # PROD (PR plan only OR manual promotion apply with approval)
  # - On PR: plan only
  # - On workflow_dispatch promote=prod: apply AFTER stag apply
  #   (Approval happens because environment: prod has required reviewers)
  # =========================
  prod:
    name: Production
    runs-on: ubuntu-latest
    needs: stag
    environment: prod
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.promote == 'prod')

    defaults:
      run:
        working-directory: infra/environments/prod

    env:
      TF_VAR_project_id: atewodros-prod
      TF_VAR_region: us-east1
      TF_VAR_env: prod
      TF_VAR_cloud_run_image: ${{ secrets.TF_VAR_cloud_run_image_PROD }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Auth (prod)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_TF_SA_PROD }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -input=false -no-color

      - name: Apply (manual promotion only, requires approval)
        if: github.event_name == 'workflow_dispatch' && inputs.promote == 'prod'
        run: terraform apply -input=false -auto-approve