name: terraform

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/sandbox

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_sandbox }}
          service_account: ${{ secrets.GCP_TF_SA_sandbox }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -input=false -no-color

      - name: Apply (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve

  stag:
    runs-on: ubuntu-latest
    needs: sandbox
    defaults:
      run:
        working-directory: infra/environments/stag

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_stag }}
          service_account: ${{ secrets.GCP_TF_SA_stag }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -input=false -no-color

      - name: Apply (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve

  prod:
    runs-on: ubuntu-latest
    needs: stag
    defaults:
      run:
        working-directory: infra/environments/prod

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_prod }}
          service_account: ${{ secrets.GCP_TF_SA_prod }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -input=false -no-color

      - name: Apply (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve